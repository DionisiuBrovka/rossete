[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rossete"
version = "0.1.0"
description = "Educational Content Generation MCP Server"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Rossete Team"},
]
keywords = ["mcp", "educational-content", "document-generation", "groq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
]

dependencies = [
    "fastmcp>=3.0.0rc1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "groq>=0.4.0",
    "aiohttp>=3.8.0",
    "python-docx>=1.0.0",
    "pypandoc>=1.10",
    "python-dotenv>=0.19.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "mypy>=1.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/DionisiuBrovka/rossete"
Documentation = "https://github.com/DionisiuBrovka/rossete"
Repository = "https://github.com/DionisiuBrovka/rossete"
Issues = "https://github.com/DionisiuBrovka/rossete/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["rossete*"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
